# Clerk cannot post to TEST, so this relay dials out and forwards deliveries
# inward, keeping their original `svix-*` headers so verification is unchanged.
# Its own colourless project, never the blue/green one: both colours run during a
# cutover, and two relays sharing a token make delivery ambiguous.
#
# `CLERK_WEBHOOK_RELAY_TOKEN` in the app env is the on-switch, and is a secret —
# it is the inbox address. `CLERK_WEBHOOK_SIGNING_SECRET` verifies deliveries.
services:
  clerk-webhook-relay:
    image: node:24-alpine
    container_name: eli-coach-platform-test-clerk-webhook-relay
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/srv/apps/eli-coach-platform/.env}
    dns:
      - 100.100.100.100
    # Forwards to the edge hostname, not a container: container names carry the
    # stack colour and change on every deploy.
    command:
      - sh
      - -c
      - >-
        exec npx --yes clerk@3.1.0 webhooks listen
        --token "$${CLERK_WEBHOOK_RELAY_TOKEN}"
        --forward-to "https://$${EDGE_HOSTNAME}/eli-coach-platform/api/auth/clerk-webhook"
    environment:
      EDGE_HOSTNAME: ${EDGE_HOSTNAME}
    labels:
      logging: promtail
      env: test
      app: eli-coach-platform
      service: clerk-webhook-relay
      host: ${HOST_LABEL}
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge_default
