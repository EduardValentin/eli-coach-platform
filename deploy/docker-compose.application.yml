# One file for TEST and PROD. `DEPLOY_ENV` (test|prod) names the containers,
# the internal network and the `env` label; the rest of deploy/env/<env>.env
# supplies the runtime values. Services that exist on TEST only carry
# `profiles: ["test"]`, and every deploy command passes `--profile "$DEPLOY_ENV"`.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  platform:
    image: ${PLATFORM_IMAGE}
    container_name: eli-coach-platform-${DEPLOY_ENV:?DEPLOY_ENV is required}-platform-${STACK_COLOR}
    restart: unless-stopped
    mem_limit: 1536m
    # Every application secret and Clerk runtime var (CLERK_PUBLISHABLE_KEY,
    # CLERK_SECRET_KEY, CLERK_SIGN_IN_URL, CLERK_SIGN_UP_URL, the optional
    # CLERK_WEBHOOK_SIGNING_SECRET, the optional
    # BOOTSTRAP_COACH_AUTH_SUBJECT_ID) reaches the container through this
    # file, terraform-infra-owned per docs/SECRET_MANAGEMENT.md. They must
    # NOT be redeclared under `environment:` below with `${VAR}`
    # interpolation: that syntax resolves against the small env file this
    # deploy passes via `docker compose --env-file` for STACK_COLOR/image
    # tags, not against APP_ENV_FILE's contents, so an unset interpolation
    # variable would blank out the real secret here and override it.
    env_file:
      - ${APP_ENV_FILE:-/srv/apps/eli-coach-platform/.env}
    environment:
      APP_NAME: eli-coach-platform
      APP_BASE_PATH: ${APP_BASE_PATH:?APP_BASE_PATH is required}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      PORT: "3000"
      STORE_ASSET_ROOT: /srv/store-assets
      CLIENT_MEDIA_PROVIDER: filesystem
      CLIENT_MEDIA_ROOT: /srv/client-media
      CLIENT_RESOURCE_ROOT: /srv/client-resources
      EXERCISE_VIDEO_ROOT: /srv/exercise-videos
      RECIPE_PHOTO_ROOT: /srv/recipe-photos
    volumes:
      - ${STORE_ASSET_ROOT_HOST}:/srv/store-assets
      - ${CLIENT_MEDIA_ROOT_HOST}:/srv/client-media
      - ${CLIENT_RESOURCE_ROOT_HOST}:/srv/client-resources
      - ${EXERCISE_VIDEO_ROOT_HOST}:/srv/exercise-videos
      - ${RECIPE_PHOTO_ROOT_HOST}:/srv/recipe-photos
    logging: *logging
    labels:
      logging: promtail
      env: ${DEPLOY_ENV}
      app: eli-coach-platform
      service: platform
      host: ${HOST_LABEL}
    networks:
      - edge
      - internal

  design-reference:
    image: ${DESIGN_REFERENCE_IMAGE}
    container_name: eli-coach-platform-${DEPLOY_ENV}-design-reference-${STACK_COLOR}
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    labels:
      logging: promtail
      env: ${DEPLOY_ENV}
      app: eli-coach-platform
      service: design-reference
      host: ${HOST_LABEL}
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge_default
  internal:
    external: true
    name: eli-coach-platform-${DEPLOY_ENV}-internal
