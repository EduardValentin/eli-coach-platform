name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: 10.33.0
  TEST_PLATFORM_BASE_PATH: /eli-coach-platform
  WAITLIST_MODE: ${{ vars.WAITLIST_MODE || 'true' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify schema migrations are up to date
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          pnpm db:generate

          if ! git diff --exit-code -- apps/platform/db/drizzle; then
            echo "::error::apps/platform/db/drizzle is out of date with the Drizzle schema. Run 'pnpm db:generate' locally, review the generated migration, and commit it."
            exit 1
          fi

          echo "Migrations are up to date with the schema."

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        env:
          STORE_ASSET_ROOT: /tmp/eli-coach-store-assets-build
          MANAGEMENT_API_SECRET: ci-build-management-api-secret-value
        run: pnpm build

      - name: Run Lighthouse CI
        # No database is provisioned for this step on purpose: the platform
        # container opens its pool on first use (see
        # apps/platform/src/server/database.server.ts), so the audited pages
        # and the two requests the shared layout makes on every one of them
        # both answer 200 with a clean console — /api/bot-detection reads
        # configuration only, and /api/waitlist reports its reduced-pricing
        # availability as unknown when no count can be read.
        env:
          # The audited pages mount Clerk's server middleware, which performs
          # a real handshake against this Development instance's Frontend API
          # on every clean-profile navigation — Lighthouse gets a fresh
          # profile every run, so lighthouserc.cjs needs the real secret key
          # here, not a dummy one; see its CLERK_SECRET_KEY comment for why.
          # This is the same Development-instance secret key already used
          # for LOCAL and TEST (docs/CLERK.md).
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: pnpm test:lighthouse

      - name: Build design reference app
        working-directory: designs/react-reference-app
        run: |
          npm ci
          npm test
          npm run build

  build_and_push:
    name: Build and Push Images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      platform_image: ${{ steps.image_refs.outputs.platform_image }}
      migration_image: ${{ steps.image_refs.outputs.migration_image }}
      design_reference_image: ${{ steps.image_refs.outputs.design_reference_image }}
      postgres_runtime_image: ${{ steps.image_refs.outputs.postgres_runtime_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Resolve GHCR owner path
        id: owner
        shell: bash
        run: |
          owner_lc="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${owner_lc}/eli-coach-platform" >> "$GITHUB_OUTPUT"

      - name: Resolve Postgres runtime base image
        id: postgres_runtime_base
        shell: bash
        run: |
          set -euo pipefail
          echo "image=$(cat docker/postgres-runtime-base-image.txt)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push platform image
        id: build_platform
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile.react-router
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-platform:${{ github.sha }}
          build-args: |
            APP_DIR=apps/platform
            APP_PACKAGE=@eli-coach-platform/platform
            APP_BASE_PATH=${{ env.TEST_PLATFORM_BASE_PATH }}/
            APP_HEALTHCHECK_PATH=${{ env.TEST_PLATFORM_BASE_PATH }}/readyz
            WAITLIST_MODE=${{ env.WAITLIST_MODE }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Build and push migration image
        id: build_migration
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile.db-migrations
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-db-migrations:${{ github.sha }}
          cache-from: type=gha,scope=db-migrations
          cache-to: type=gha,mode=max,scope=db-migrations

      - name: Build and push design reference image
        id: build_design_reference
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile.design-reference
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-design-reference:${{ github.sha }}
          build-args: |
            VITE_BASE_PATH=${{ env.TEST_PLATFORM_BASE_PATH }}/design-reference/
          cache-from: type=gha,scope=design-reference
          cache-to: type=gha,mode=max,scope=design-reference

      - name: Build and push Postgres runtime image
        id: build_postgres_runtime
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile.postgres-runtime
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-postgres-runtime:${{ github.sha }}
          build-args: |
            POSTGRES_IMAGE=${{ steps.postgres_runtime_base.outputs.image }}
          cache-from: type=gha,scope=postgres-runtime
          cache-to: type=gha,mode=max,scope=postgres-runtime

      - name: Collect image refs
        id: image_refs
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.owner.outputs.image_prefix }}
        run: |
          set -euo pipefail

          platform_image="${IMAGE_PREFIX}-platform@${{ steps.build_platform.outputs.digest }}"
          migration_image="${IMAGE_PREFIX}-db-migrations@${{ steps.build_migration.outputs.digest }}"
          design_reference_image="${IMAGE_PREFIX}-design-reference@${{ steps.build_design_reference.outputs.digest }}"
          postgres_runtime_image="${IMAGE_PREFIX}-postgres-runtime@${{ steps.build_postgres_runtime.outputs.digest }}"

          cat > image-refs.json <<EOF
          {
            "platform": "${platform_image}",
            "migration": "${migration_image}",
            "designReference": "${design_reference_image}",
            "postgresRuntime": "${postgres_runtime_image}"
          }
          EOF

          {
            echo "platform_image=${platform_image}"
            echo "migration_image=${migration_image}"
            echo "design_reference_image=${design_reference_image}"
            echo "postgres_runtime_image=${postgres_runtime_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload image refs artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-refs-${{ github.sha }}
          path: image-refs.json

  security_gate:
    name: Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image_target:
          - platform
          - migration
          - design-reference
          - postgres-runtime
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Resolve scan target
        id: image
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_TARGET: ${{ matrix.image_target }}
          TEST_PLATFORM_BASE_PATH: ${{ env.TEST_PLATFORM_BASE_PATH }}
        run: |
          set -euo pipefail

          case "${IMAGE_TARGET}" in
            platform)
              image_ref="eli-coach-platform-security-gate-platform:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.react-router"
              vuln_type="os,library"
              trivyignores="${GITHUB_WORKSPACE}/.trivyignore.platform.yaml"
              printf 'build_args<<EOF\nAPP_DIR=apps/platform\nAPP_PACKAGE=@eli-coach-platform/platform\nAPP_BASE_PATH=%s/\nAPP_HEALTHCHECK_PATH=%s/readyz\nWAITLIST_MODE=%s\nEOF\n' \
                "${TEST_PLATFORM_BASE_PATH}" \
                "${TEST_PLATFORM_BASE_PATH}" \
                "${WAITLIST_MODE}" >> "$GITHUB_OUTPUT"
              ;;
            migration)
              image_ref="eli-coach-platform-security-gate-migration:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.db-migrations"
              vuln_type="os,library"
              ;;
            design-reference)
              image_ref="eli-coach-platform-security-gate-design-reference:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.design-reference"
              vuln_type="os,library"
              printf 'build_args<<EOF\nVITE_BASE_PATH=%s/design-reference/\nEOF\n' "${TEST_PLATFORM_BASE_PATH}" >> "$GITHUB_OUTPUT"
              ;;
            postgres-runtime)
              image_ref="eli-coach-platform-security-gate-postgres-runtime:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.postgres-runtime"
              vuln_type="os"
              trivyignores="${GITHUB_WORKSPACE}/.trivyignore.postgres-runtime"
              postgres_runtime_base_image="$(cat "${GITHUB_WORKSPACE}/docker/postgres-runtime-base-image.txt")"
              printf 'build_args<<EOF\nPOSTGRES_IMAGE=%s\nEOF\n' "${postgres_runtime_base_image}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported image target: ${IMAGE_TARGET}"
              exit 1
              ;;
          esac

          {
            echo "image_ref=${image_ref}"
            echo "dockerfile=${dockerfile:-}"
            echo "vuln_type=${vuln_type}"
            echo "trivyignores=${trivyignores:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image for scan
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          load: true
          pull: true
          tags: ${{ steps.image.outputs.image_ref }}
          build-args: ${{ steps.image.outputs.build_args }}

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: ${{ steps.image.outputs.vuln_type }}
          trivyignores: ${{ steps.image.outputs.trivyignores }}
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_PULL_USERNAME || github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}

  deploy_test:
    name: Deploy to TEST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - build_and_push
      - security_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Resolve target config
        id: target
        shell: bash
        env:
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          TEST_NODE_HOSTNAME: ${{ vars.TEST_NODE_HOSTNAME || 'susanoo-test.longhair-eagle.ts.net' }}
          TEST_EDGE_HOSTNAME: ${{ vars.TEST_EDGE_HOSTNAME || secrets.TEST_EDGE_HOSTNAME }}
        run: |
          set -euo pipefail

          if [[ -z "${TEST_NODE_HOSTNAME}" || -z "${TEST_SSH_KNOWN_HOSTS}" || -z "${TEST_EDGE_HOSTNAME}" ]]; then
            echo "Missing TEST deploy configuration"
            exit 1
          fi

          echo "node_hostname=${TEST_NODE_HOSTNAME%.}" >> "$GITHUB_OUTPUT"
          printf "ssh_known_hosts<<EOF\n%s\nEOF\n" "${TEST_SSH_KNOWN_HOSTS}" >> "$GITHUB_OUTPUT"
          echo "edge_hostname=${TEST_EDGE_HOSTNAME}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          hostname: gha-eli-coach-platform-ci
          tags: tag:ci-app-deploy
          ping: ${{ steps.target.outputs.node_hostname }}

      - name: Resolve TEST host over Tailscale
        id: ssh
        shell: bash
        env:
          NODE_HOSTNAME: ${{ steps.target.outputs.node_hostname }}
        run: |
          set -euo pipefail

          node_hostname="${NODE_HOSTNAME%.}"
          short_hostname="${node_hostname%%.*}"
          ssh_ip="$(tailscale status --json | jq -r --arg fqdn "${node_hostname}." --arg raw "$node_hostname" --arg host "$short_hostname" '
            [(.Peer // [])[] | select(.DNSName == $fqdn or .DNSName == $raw or .HostName == $host) | .TailscaleIPs[0]][0] // empty
          ')"

          if [[ -z "${ssh_ip}" ]]; then
            echo "Could not resolve TEST node ${node_hostname} to a Tailscale IP"
            exit 1
          fi

          echo "ssh_target=root@${ssh_ip}" >> "$GITHUB_OUTPUT"
          echo "host_key_alias=${node_hostname}" >> "$GITHUB_OUTPUT"

      - name: Write pinned SSH known_hosts
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.target.outputs.ssh_known_hosts }}" > /tmp/known_hosts
          chmod 600 /tmp/known_hosts

      - name: Install deploy assets on TEST host
        env:
          SSH_TARGET: ${{ steps.ssh.outputs.ssh_target }}
          SSH_HOST_KEY_ALIAS: ${{ steps.ssh.outputs.host_key_alias }}
        run: |
          set -euo pipefail

          remote_command=$(cat <<'EOF'
          set -euo pipefail
          sudo install -d -m 0755 /srv/apps/eli-coach-platform /srv/apps/eli-coach-platform/deploy/test /srv/apps/eli-coach-platform/scripts/deploy
          sudo tar -xzf - -C /srv/apps/eli-coach-platform
          sudo chmod 0755 /srv/apps/eli-coach-platform/scripts/deploy/deploy_test.sh /srv/apps/eli-coach-platform/scripts/deploy/run_test_migrations.sh
          EOF
          )

          tar -czf - \
            scripts/deploy/deploy_test.sh \
            scripts/deploy/run_test_migrations.sh \
            deploy/test/docker-compose.application.yml \
            deploy/test/docker-compose.infrastructure.yml \
            deploy/test/traefik-dynamic.yml.template \
            | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts -o HostKeyAlias="$SSH_HOST_KEY_ALIAS" -o ProxyCommand='tailscale nc %h %p' "$SSH_TARGET" "$remote_command"

      - name: Verify runtime env files exist on TEST
        env:
          SSH_TARGET: ${{ steps.ssh.outputs.ssh_target }}
          SSH_HOST_KEY_ALIAS: ${{ steps.ssh.outputs.host_key_alias }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts -o HostKeyAlias="$SSH_HOST_KEY_ALIAS" -o ProxyCommand='tailscale nc %h %p' "$SSH_TARGET" "sudo test -s /srv/apps/eli-coach-platform/.env && sudo test -s /srv/postgres/eli-coach-platform.env"

      - name: Deploy image set to TEST
        env:
          SSH_TARGET: ${{ steps.ssh.outputs.ssh_target }}
          SSH_HOST_KEY_ALIAS: ${{ steps.ssh.outputs.host_key_alias }}
          EDGE_HOSTNAME: ${{ steps.target.outputs.edge_hostname }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          PLATFORM_IMAGE: ${{ needs.build_and_push.outputs.platform_image }}
          MIGRATION_IMAGE: ${{ needs.build_and_push.outputs.migration_image }}
          DESIGN_REFERENCE_IMAGE: ${{ needs.build_and_push.outputs.design_reference_image }}
          POSTGRES_RUNTIME_IMAGE: ${{ needs.build_and_push.outputs.postgres_runtime_image }}
        run: |
          set -euo pipefail

          if [[ -z "${GHCR_PULL_USERNAME}" || -z "${GHCR_PULL_TOKEN}" ]]; then
            echo "Missing GHCR pull credentials for remote deploy"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts -o HostKeyAlias="$SSH_HOST_KEY_ALIAS" -o ProxyCommand='tailscale nc %h %p' "$SSH_TARGET" \
            "sudo EDGE_HOSTNAME='${EDGE_HOSTNAME}' HOST_LABEL='${EDGE_HOSTNAME}' GHCR_USERNAME='${GHCR_PULL_USERNAME}' GHCR_TOKEN='${GHCR_PULL_TOKEN}' PLATFORM_IMAGE='${PLATFORM_IMAGE}' MIGRATION_IMAGE='${MIGRATION_IMAGE}' DESIGN_REFERENCE_IMAGE='${DESIGN_REFERENCE_IMAGE}' POSTGRES_RUNTIME_IMAGE='${POSTGRES_RUNTIME_IMAGE}' bash /srv/apps/eli-coach-platform/scripts/deploy/deploy_test.sh"

      - name: Cleanup temporary known_hosts
        if: always()
        run: rm -f /tmp/known_hosts
