# The edge's own shared middlewares and certificate, which the app templates
# reference as @file.
http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

tls:
  certificates:
    - certFile: /certs/sim.crt
      keyFile: /certs/sim.key
