name: Record a PROD deployment's result
description: >-
  Sets the final status of the deployment record-prod-deployment-start created, from
  the deploy script's exit code that remote-deploy kept.

inputs:
  deployment-id:
    description: The id record-prod-deployment-start returned
    required: true
  deploy-outcome:
    description: The remote-deploy step's outcome, shown when the deploy never started
    required: true

runs:
  using: composite
  steps:
    - name: Set the deployment status
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        DEPLOY_OUTCOME: ${{ inputs.deploy-outcome }}
      run: |
        set -euo pipefail

        exit_code=""
        exit_code_file="${RUNNER_TEMP}/remote-deploy/deploy-exit-code"
        if [[ -f "${exit_code_file}" ]]; then
          exit_code="$(cat "${exit_code_file}")"
        fi

        case "${exit_code}" in
          0) state=success; description="Deployed" ;;
          10) state=failure; description="Refused: another deploy is running or the live release changed (exit 10)" ;;
          11) state=failure; description="Stopped: the pre-deploy backup failed (exit 11)" ;;
          12) state=failure; description="Failed before the switch; the live release was not touched (exit 12)" ;;
          20) state=failure; description="Public check failed; switched back to the previous release (exit 20)" ;;
          30) state=failure; description="Switch-back failed; PROD needs a person (exit 30)" ;;
          "") state=failure; description="The deploy did not start (${DEPLOY_OUTCOME})" ;;
          *) state=failure; description="Failed: deploy exit ${exit_code}, step ${DEPLOY_OUTCOME}" ;;
        esac

        gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
          -f state="${state}" \
          -f environment=production \
          -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          -f description="${description}" > /dev/null
