name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: 10.33.0
  TEST_PLATFORM_BASE_PATH: /eli-coach-platform

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify schema migrations are up to date
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          pnpm db:generate

          if ! git diff --exit-code -- apps/platform/db/drizzle; then
            echo "::error::apps/platform/db/drizzle is out of date with the Drizzle schema. Run 'pnpm db:generate' locally, review the generated migration, and commit it."
            exit 1
          fi

          echo "Migrations are up to date with the schema."

      - name: Validate workspace
        run: pnpm validate:unit

      - name: Run Lighthouse CI
        # No database on purpose: the container opens its pool on first use
        # (apps/platform/src/composition-root/database.server.ts), so the public pages
        # still render, with availability reported as unavailable.
        run: pnpm test:lighthouse

      - name: Build design reference app
        working-directory: designs/react-reference-app
        run: |
          npm ci
          npm run typecheck
          npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the integration suites
        run: pnpm test:integration

  deploy_simulation:
    name: Deploy simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Lint the workflows
        run: npm run check:workflows

      - name: Run the deploy script against a simulated host
        run: npm run test:deploy-simulation

  build_and_push:
    name: Build and Push Images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - validate
      - integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      platform_image: ${{ steps.image_refs.outputs.platform_image }}
      migration_image: ${{ steps.image_refs.outputs.migration_image }}
      design_reference_image: ${{ steps.image_refs.outputs.design_reference_image }}
      postgres_runtime_image: ${{ steps.image_refs.outputs.postgres_runtime_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Resolve GHCR owner path
        id: owner
        shell: bash
        run: |
          owner_lc="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${owner_lc}/eli-coach-platform" >> "$GITHUB_OUTPUT"

      - name: Resolve Postgres runtime base image
        id: postgres_runtime_base
        shell: bash
        run: |
          set -euo pipefail
          echo "image=$(cat docker/postgres-runtime-base-image.txt)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push platform image
        id: build_platform
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.react-router
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-platform:${{ github.sha }}
          build-args: |
            APP_DIR=apps/platform
            APP_PACKAGE=@eli-coach-platform/platform
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Build and push migration image
        id: build_migration
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.db-migrations
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-db-migrations:${{ github.sha }}
          cache-from: type=gha,scope=db-migrations
          cache-to: type=gha,mode=max,scope=db-migrations

      - name: Build and push design reference image
        id: build_design_reference
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.design-reference
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-design-reference:${{ github.sha }}
          build-args: |
            VITE_BASE_PATH=${{ env.TEST_PLATFORM_BASE_PATH }}/design-reference/
          cache-from: type=gha,scope=design-reference
          cache-to: type=gha,mode=max,scope=design-reference

      - name: Build and push Postgres runtime image
        id: build_postgres_runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.postgres-runtime
          pull: true
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.owner.outputs.image_prefix }}-postgres-runtime:${{ github.sha }}
          build-args: |
            POSTGRES_IMAGE=${{ steps.postgres_runtime_base.outputs.image }}
          cache-from: type=gha,scope=postgres-runtime
          cache-to: type=gha,mode=max,scope=postgres-runtime

      - name: Collect image refs
        id: image_refs
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.owner.outputs.image_prefix }}
        run: |
          set -euo pipefail

          platform_image="${IMAGE_PREFIX}-platform@${{ steps.build_platform.outputs.digest }}"
          migration_image="${IMAGE_PREFIX}-db-migrations@${{ steps.build_migration.outputs.digest }}"
          design_reference_image="${IMAGE_PREFIX}-design-reference@${{ steps.build_design_reference.outputs.digest }}"
          postgres_runtime_image="${IMAGE_PREFIX}-postgres-runtime@${{ steps.build_postgres_runtime.outputs.digest }}"

          cat > image-refs.json <<EOF
          {
            "platform": "${platform_image}",
            "migration": "${migration_image}",
            "designReference": "${design_reference_image}",
            "postgresRuntime": "${postgres_runtime_image}"
          }
          EOF

          {
            echo "platform_image=${platform_image}"
            echo "migration_image=${migration_image}"
            echo "design_reference_image=${design_reference_image}"
            echo "postgres_runtime_image=${postgres_runtime_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload image refs artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-refs-${{ github.sha }}
          path: image-refs.json

  security_gate:
    name: Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - validate
      - integration
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image_target:
          - platform
          - migration
          - design-reference
          - postgres-runtime
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Resolve scan target
        id: image
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_TARGET: ${{ matrix.image_target }}
          TEST_PLATFORM_BASE_PATH: ${{ env.TEST_PLATFORM_BASE_PATH }}
        run: |
          set -euo pipefail

          case "${IMAGE_TARGET}" in
            platform)
              image_ref="eli-coach-platform-security-gate-platform:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.react-router"
              vuln_type="os,library"
              trivyignores="${GITHUB_WORKSPACE}/.trivyignore.platform.yaml"
              printf 'build_args<<EOF\nAPP_DIR=apps/platform\nAPP_PACKAGE=@eli-coach-platform/platform\nEOF\n' >> "$GITHUB_OUTPUT"
              ;;
            migration)
              image_ref="eli-coach-platform-security-gate-migration:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.db-migrations"
              vuln_type="os,library"
              ;;
            design-reference)
              image_ref="eli-coach-platform-security-gate-design-reference:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.design-reference"
              vuln_type="os,library"
              printf 'build_args<<EOF\nVITE_BASE_PATH=%s/design-reference/\nEOF\n' "${TEST_PLATFORM_BASE_PATH}" >> "$GITHUB_OUTPUT"
              ;;
            postgres-runtime)
              image_ref="eli-coach-platform-security-gate-postgres-runtime:${GITHUB_SHA}"
              dockerfile="docker/Dockerfile.postgres-runtime"
              vuln_type="os"
              trivyignores="${GITHUB_WORKSPACE}/.trivyignore.postgres-runtime"
              postgres_runtime_base_image="$(cat "${GITHUB_WORKSPACE}/docker/postgres-runtime-base-image.txt")"
              printf 'build_args<<EOF\nPOSTGRES_IMAGE=%s\nEOF\n' "${postgres_runtime_base_image}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported image target: ${IMAGE_TARGET}"
              exit 1
              ;;
          esac

          {
            echo "image_ref=${image_ref}"
            echo "dockerfile=${dockerfile:-}"
            echo "vuln_type=${vuln_type}"
            echo "trivyignores=${trivyignores:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image for scan
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          load: true
          pull: true
          tags: ${{ steps.image.outputs.image_ref }}
          build-args: ${{ steps.image.outputs.build_args }}

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: ${{ steps.image.outputs.vuln_type }}
          trivyignores: ${{ steps.image.outputs.trivyignores }}
        env:
          TRIVY_USERNAME: ${{ secrets.GHCR_PULL_USERNAME || github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}

  deploy_test:
    name: Deploy to TEST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - build_and_push
      - security_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Resolve target config
        id: target
        shell: bash
        env:
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          TEST_NODE_HOSTNAME: ${{ vars.TEST_NODE_HOSTNAME || 'susanoo-test.longhair-eagle.ts.net' }}
          TEST_EDGE_HOSTNAME: ${{ vars.TEST_EDGE_HOSTNAME || secrets.TEST_EDGE_HOSTNAME }}
        run: |
          set -euo pipefail

          if [[ -z "${TEST_NODE_HOSTNAME}" || -z "${TEST_SSH_KNOWN_HOSTS}" || -z "${TEST_EDGE_HOSTNAME}" ]]; then
            echo "Missing TEST deploy configuration"
            exit 1
          fi

          {
            echo "node_hostname=${TEST_NODE_HOSTNAME%.}"
            printf "ssh_known_hosts<<EOF\n%s\nEOF\n" "${TEST_SSH_KNOWN_HOSTS}"
            echo "edge_hostname=${TEST_EDGE_HOSTNAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Connect to the TEST host
        uses: ./.github/actions/remote-connect
        with:
          node-hostname: ${{ steps.target.outputs.node_hostname }}
          ssh-known-hosts: ${{ steps.target.outputs.ssh_known_hosts }}
          tailscale-oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tailscale-hostname: gha-eli-coach-platform-ci
          tailscale-tags: tag:ci-app-deploy

      - name: Deploy image set to TEST
        uses: ./.github/actions/remote-deploy
        with:
          deploy-env: test
          edge-hostname: ${{ steps.target.outputs.edge_hostname }}
          host-label: ${{ steps.target.outputs.edge_hostname }}
          release-sha: ${{ github.sha }}
          ghcr-username: ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
          platform-image: ${{ needs.build_and_push.outputs.platform_image }}
          migration-image: ${{ needs.build_and_push.outputs.migration_image }}
          design-reference-image: ${{ needs.build_and_push.outputs.design_reference_image }}
          postgres-runtime-image: ${{ needs.build_and_push.outputs.postgres_runtime_image }}

      - name: Cleanup temporary SSH state
        if: always()
        run: rm -rf "${RUNNER_TEMP}/remote-deploy"

  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - build_and_push
      - deploy_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `deployment: false` keeps the reviewers and the environment secrets but
    # stops GitHub from recording its own deployment: the job records the
    # digests itself. No `concurrency` key: a second approval queues behind the
    # first, and the host lock plus EXPECTED_LIVE_SHA settle which one wins.
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Nothing below reaches PROD until every value exists, so a missing
      # variable, secret or pinned host key stops the run here.
      - name: Resolve PROD config
        id: prod_config
        uses: ./.github/actions/resolve-prod-config
        with:
          node-hostname: ${{ vars.PROD_NODE_HOSTNAME }}
          edge-hostname: ${{ vars.PROD_EDGE_HOSTNAME }}
          ssh-known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          tailscale-oauth-client-id: ${{ secrets.PROD_TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.PROD_TAILSCALE_OAUTH_SECRET }}
          ghcr-username: ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Connect to the PROD host
        uses: ./.github/actions/remote-connect
        with:
          node-hostname: ${{ steps.prod_config.outputs.node-hostname }}
          ssh-known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          tailscale-oauth-client-id: ${{ secrets.PROD_TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.PROD_TAILSCALE_OAUTH_SECRET }}
          tailscale-hostname: gha-eli-coach-platform-prod-ci
          tailscale-tags: tag:ci-prod-deploy

      - name: Read the live PROD release
        id: live
        uses: ./.github/actions/remote-live-release

      - name: Decide whether this commit may be promoted
        id: verdict
        shell: bash
        env:
          LIVE_RELEASE: ${{ steps.live.outputs.live-release }}
        run: |
          set -euo pipefail

          live_sha="none"
          if [[ -n "${LIVE_RELEASE}" ]]; then
            live_sha="$(jq -r '.sha' <<< "${LIVE_RELEASE}")"
          fi

          node scripts/deploy/release-plan.mjs promote "${live_sha}" "${GITHUB_SHA}"

          echo "live_sha=${live_sha}" >> "$GITHUB_OUTPUT"

      - name: Record the PROD deployment as in progress
        id: deployment
        uses: ./.github/actions/record-prod-deployment-start
        with:
          sha: ${{ github.sha }}
          kind: release
          previous-sha: ${{ steps.verdict.outputs.live_sha }}
          platform-image: ${{ needs.build_and_push.outputs.platform_image }}
          migration-image: ${{ needs.build_and_push.outputs.migration_image }}
          postgres-runtime-image: ${{ needs.build_and_push.outputs.postgres_runtime_image }}

      - name: Deploy the image set to PROD
        id: deploy
        uses: ./.github/actions/remote-deploy
        with:
          deploy-env: prod
          edge-hostname: ${{ steps.prod_config.outputs.edge-hostname }}
          host-label: ${{ steps.prod_config.outputs.node-hostname }}
          release-sha: ${{ github.sha }}
          expected-live-sha: ${{ steps.verdict.outputs.live_sha }}
          ghcr-username: ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
          platform-image: ${{ needs.build_and_push.outputs.platform_image }}
          migration-image: ${{ needs.build_and_push.outputs.migration_image }}
          postgres-runtime-image: ${{ needs.build_and_push.outputs.postgres_runtime_image }}

      - name: Record the PROD deployment result
        if: always() && steps.deployment.outputs.id != ''
        uses: ./.github/actions/record-prod-deployment-result
        with:
          deployment-id: ${{ steps.deployment.outputs.id }}
          deploy-outcome: ${{ steps.deploy.outcome }}

      - name: Cleanup temporary SSH state
        if: always()
        run: rm -rf "${RUNNER_TEMP}/remote-deploy"
