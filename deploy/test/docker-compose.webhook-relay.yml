# Opt-in sidecar that relays live Clerk webhook deliveries into TEST.
#
# TEST has no public DNS, so Clerk cannot post to it directly. The Clerk CLI
# webhook listener dials *out* to Clerk and forwards each delivery back in
# over the compose network, so the host needs no inbound exposure at all.
# `CLERK_WEBHOOK_RELAY_TOKEN` pins the relay's inbox URL across restarts —
# without it every restart would mint a new inbox and the Dashboard endpoint
# would need re-pointing each time.
#
# Not part of the standard deploy: `docker-compose.application.yml` and
# `docker-compose.infrastructure.yml` come up on every release, this does
# not. Bring it up explicitly when TEST needs to exercise real webhook
# delivery end to end:
#
#   docker compose -f deploy/test/docker-compose.webhook-relay.yml up -d
#
# Per GEN-188: LOCAL and TEST are two separate relay inboxes, each with its
# own token and its own Clerk Dashboard endpoint, even though both endpoints
# receive every event the shared Development instance produces. Reusing one
# token across environments would let deliveries meant for one land on the
# other. `CLERK_WEBHOOK_SIGNING_SECRET` in the app's runtime env must be the
# signing secret of the Dashboard endpoint registered against *this* relay's
# inbox — pairing it with the wrong endpoint's secret fails verification on
# every forwarded delivery.
#
# Forwards to the `platform` service on the `internal` network — the same
# service and network `docker-compose.application.yml` defines — rather than
# a container name, since the app container name carries the stack colour
# and changes on every blue/green deploy.
services:
  clerk-webhook-relay:
    # Pinned to the same digest docker/Dockerfile.react-router uses, so the
    # relay and the app build from the identical, reproducible base image.
    image: node:24.20.0-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
    container_name: eli-coach-platform-test-clerk-webhook-relay
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/srv/apps/eli-coach-platform/.env}
    # clerk@3.2.0 is pinned rather than clerk@latest so a Clerk CLI release
    # can't silently change relay behavior underneath TEST; bump deliberately.
    command:
      - sh
      - -c
      - >-
        exec npx -y clerk@3.2.0 webhooks listen
        --forward-to http://platform:3000/api/clerk/webhooks
        --token "$${CLERK_WEBHOOK_RELAY_TOKEN}"
    labels:
      logging: promtail
      env: test
      app: eli-coach-platform
      service: clerk-webhook-relay
      host: ${HOST_LABEL}
    networks:
      - internal

  # The Stripe counterpart: `stripe listen` dials out to Stripe, receives the
  # account's test-mode events and forwards each one back in over the compose
  # network, signing it with the CLI's own secret. That secret is derived
  # from the API key, so `stripe listen --api-key "$STRIPE_SECRET_KEY"
  # --print-secret` prints the value `STRIPE_WEBHOOK_SIGNING_SECRET` must
  # hold; rotating the key changes the secret. The app is mounted under
  # /eli-coach-platform on TEST, so the forward path carries the base path.
  # Stripe does not redeliver events the relay missed while it was down.
  stripe-webhook-relay:
    # Pinned to the digest of the v1.35.0 release, the CLI version verified
    # locally; bump deliberately.
    image: stripe/stripe-cli@sha256:8c600a76e784d667c0557d0482b3c3dd53b89576ed8c512074c56e17569dc9b9
    container_name: eli-coach-platform-test-stripe-webhook-relay
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/srv/apps/eli-coach-platform/.env}
    # The key comes from the env file inside the container, not from compose
    # interpolation on the host, hence the shell and the escaped variable.
    entrypoint:
      - sh
      - -c
    command:
      - >-
        exec stripe listen
        --api-key "$${STRIPE_SECRET_KEY}"
        --events checkout.session.completed
        --forward-to http://platform:3000/eli-coach-platform/api/stripe/webhooks
    labels:
      logging: promtail
      env: test
      app: eli-coach-platform
      service: stripe-webhook-relay
      host: ${HOST_LABEL}
    networks:
      - internal

networks:
  internal:
    external: true
    name: eli-coach-platform-test-internal
